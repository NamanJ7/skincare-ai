appId: com.pore.mobile
---
- openLink: pore://internal/e2e-fixtures
- tapOn:
    id: e2e-fixture-mapped-products
- stopApp
- launchApp
- tapOn:
    id: daily-loop-start
- repeat:
    times: 10
    while:
      visible:
        id: daily-loop-done
    commands:
      - tapOn:
          id: daily-loop-done
- tapOn:
    id: daily-loop-finish
- tapOn:
    id: daily-loop-reaction-comfortable
- tapOn: Back to Home
- assertVisible: Progress
