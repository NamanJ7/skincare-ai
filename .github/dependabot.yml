version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
      testing:
        patterns:
          - "vitest"
          - "playwright"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
