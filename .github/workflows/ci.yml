name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Expo dependency compatibility
        run: pnpm --filter @pore/mobile exec expo install --check

      - name: Lint
        run: pnpm lint

      - name: Audit product claims
        run: pnpm audit:copy

      - name: Audit mobile theme
        run: pnpm audit:theme

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify beta/production fixture gate
        run: |
          pnpm --filter @pore/mobile exec expo export --platform web --output-dir .expo-live-preview --clear
          E2E_EXPECT_DISABLED=1 pnpm test:e2e

      - name: Build internal E2E web preview
        run: EXPO_PUBLIC_E2E_FIXTURES=1 pnpm --filter @pore/mobile exec expo export --platform web --output-dir .expo-live-preview --clear

      - name: Browser daily-loop journey
        run: pnpm test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
